name: CI

on:
  push:
    branches: [release/oss]
  pull_request:

jobs:
  test-python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pm-collab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pm-collab/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest
        env:
          PM_DATABASE_URL: "sqlite:///./.ci_test.db"

  build-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pm-collab/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: pm-collab/web/package-lock.json
      - run: npm ci
      - run: npm run build
