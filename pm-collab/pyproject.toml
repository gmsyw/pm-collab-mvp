[project]
name = "pm-collab"
version = "0.1.0"
description = "人机共用项目管理软件（PM-Collab）MVP"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "PyJWT>=2.10",
    "bcrypt>=4.2",
    "watchdog>=6.0",
    "APScheduler>=3.10",
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
pg = ["psycopg[binary]>=3.2"]
test = ["pytest>=8.3", "pytest-cov>=6.0", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = "."
include = ["server*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["server"]
omit = ["server/app/main.py", "*/alembic/*"]
